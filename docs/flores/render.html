<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1280" height="720"></canvas>
<script src="motor.js"></script>
<script>
const rutas=[];for(let i=1;i<=12;i++)rutas.push('planos/p'+String(i).padStart(2,'0')+'.jpg');
const M=HERBARIO.iniciar(document.getElementById('cv'),rutas,()=>{M.dibujar(0)});
window.pintar=t=>{M.dibujar(t);return true};
window.DUR=HERBARIO.TOTAL;
</script></body></html>
