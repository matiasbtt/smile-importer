<script>
/* =====================================================================
   SMILE IMPORTER · CRM — lógica de interfaz
   Un solo estado (`D`) que llega del servidor, y funciones que lo pintan.
   ===================================================================== */

var D = null;                 // datos del servidor
var VISTA = 'panel';
var F = { cat: '', estado: '', canal: '', q: '' };   // filtros del pipeline

/* ── Utilidades ─────────────────────────────────────────────────── */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function bs(n) {
  var v = Number(n || 0);
  return (D ? D.config.moneda : 'Bs') + ' ' + v.toLocaleString('es-BO', { maximumFractionDigits: 0 });
}
function num(n) { return Number(n || 0).toLocaleString('es-BO', { maximumFractionDigits: 0 }); }
function tel(t) { return t ? '+' + t : '—'; }
function claseEstado(e) { return String(e || '').toLowerCase().replace(/\s+/g, ''); }

function brindis(txt, malo) {
  var b = document.getElementById('brindis');
  b.textContent = txt;
  b.className = 'on' + (malo ? ' malo' : '');
  clearTimeout(b._t);
  b._t = setTimeout(function () { b.className = ''; }, malo ? 6500 : 3000);
}

function abrirModal(titulo, html) {
  document.getElementById('modalTitulo').textContent = titulo;
  document.getElementById('modalCuerpo').innerHTML = html;
  document.getElementById('velo').classList.add('on');
}
function cerrarModal() { document.getElementById('velo').classList.remove('on'); }
document.getElementById('velo').addEventListener('click', function (e) {
  if (e.target.id === 'velo') cerrarModal();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });

function val(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

/** Envuelve google.script.run en promesa, para no anidar callbacks. */
function srv(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, err) {
    google.script.run.withSuccessHandler(ok).withFailureHandler(err)[fn].apply(null, args);
  });
}


/* ── Carga ──────────────────────────────────────────────────────── */
function cargar(silencioso) {
  if (!silencioso) document.getElementById('cargando').classList.remove('off');
  return srv('apiCargar').then(function (d) {
    D = d;
    document.getElementById('cargando').classList.add('off');
    document.getElementById('pieMoneda').textContent = D.config.moneda.toUpperCase() + ' · BOLIVIA';
    document.getElementById('pieSync').textContent = 'AL ' + D.hoy;
    contadores();
    render();
  }).catch(function (e) {
    document.getElementById('cargando').innerHTML =
      '<div style="text-align:center;max-width:520px">' +
      '<div class="err" style="margin-bottom:10px">NO PUDE LEER LA PLANILLA</div>' +
      '<div class="tenue" style="font-family:var(--ui);font-size:12px">' + esc(e.message || e) +
      '<br><br>Si dice que falta una pestaña, cerrá esta ventana y corré<br>' +
      '<b>SMILE CRM → Configuración inicial / migrar datos</b>.</div></div>';
  });
}

function contadores() {
  var abiertas = D.oportunidades.filter(function (o) {
    return D.catalogos.estadosAbiertos.indexOf(o.estado) >= 0;
  }).length;
  var bajos = D.productos.filter(function (p) { return p.activo && p.stock <= p.stockMinimo; }).length;
  var pend = D.agenda.filter(function (a) { return a.estado !== 'Hecho'; }).length;
  document.getElementById('pillPipe').textContent = abiertas;
  document.getElementById('pillInv').textContent = bajos;
  document.getElementById('pillCon').textContent = D.contactos.length;
  document.getElementById('pillAge').textContent = pend;
}


/* ── Navegación ─────────────────────────────────────────────────── */
var TITULOS = {
  panel: ['Panel', 'RESUMEN DEL NEGOCIO'],
  pipeline: ['Pipeline', 'OPORTUNIDADES POR TIPO DE EQUIPO'],
  inventario: ['Inventario', 'STOCK Y MOVIMIENTOS'],
  contactos: ['Contactos', 'AGENDA DE NUMEROS'],
  agenda: ['Agenda', 'RECORDATORIOS Y CALENDARIO'],
  metricas: ['Métricas', 'INSTAGRAM · FACEBOOK · META'],
  ajustes: ['Ajustes', 'CONFIGURACION DE LA MACRO']
};

document.getElementById('nav').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-v]');
  if (!b) return;
  VISTA = b.dataset.v;
  Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
    x.classList.toggle('on', x.dataset.v === VISTA);
  });
  render();
});

document.getElementById('btnRecargar').onclick = function () { cargar(); };
document.getElementById('btnResumen').onclick = function () {
  this.disabled = true;
  var b = this;
  srv('apiResumenAhora').then(function () {
    brindis('Resumen enviado por correo.'); b.disabled = false;
  }).catch(function (e) { brindis(e.message || e, true); b.disabled = false; });
};

function render() {
  document.getElementById('titulo').textContent = TITULOS[VISTA][0];
  document.getElementById('subtitulo').textContent = TITULOS[VISTA][1];
  var m = document.getElementById('vista');
  m.scrollTop = 0;
  m.innerHTML = ({
    panel: vPanel, pipeline: vPipeline, inventario: vInventario,
    contactos: vContactos, agenda: vAgenda, metricas: vMetricas, ajustes: vAjustes
  })[VISTA]();
}


/* ── Vista: Panel ───────────────────────────────────────────────── */
function vPanel() {
  var ops = D.oportunidades;
  var vendidas = ops.filter(function (o) { return o.estado === 'Vendido'; });
  var abiertas = ops.filter(function (o) { return D.catalogos.estadosAbiertos.indexOf(o.estado) >= 0; });
  var ingreso = vendidas.reduce(function (a, o) { return a + o.total; }, 0);
  var unidades = vendidas.reduce(function (a, o) { return a + o.cantidad; }, 0);
  var pipeline = abiertas.reduce(function (a, o) { return a + o.total; }, 0);
  var conversion = ops.length ? Math.round(vendidas.length / ops.length * 100) : 0;
  var bajos = D.productos.filter(function (p) { return p.activo && p.stock <= p.stockMinimo; });
  var negativos = D.productos.filter(function (p) { return p.stock < 0; });
  var vencidos = abiertas.filter(function (o) { return o.proximo && o.proximo <= D.hoy; });

  var h = '';

  h += '<div class="kpis">' +
    kpi('Vendido', bs(ingreso), vendidas.length + ' operaciones · ' + unidades + ' unidades', 'acento') +
    kpi('Pipeline abierto', bs(pipeline), abiertas.length + ' oportunidades vivas', '') +
    kpi('Conversión', conversion + '%', vendidas.length + ' de ' + ops.length + ' consultas', '') +
    kpi('Seguimientos vencidos', String(vencidos.length), vencidos.length ? 'hay que escribirles hoy' : 'al día', vencidos.length ? 'aviso' : '') +
    kpi('Stock bajo mínimo', String(bajos.length), bajos.length ? 'referencias para reponer' : 'todo cubierto', bajos.length ? 'aviso' : '') +
    '</div>';

  if (negativos.length) {
    h += '<div class="aviso malo"><b>Stock negativo en ' + negativos.length + ' referencia(s).</b> ' +
      'Se vendieron más unidades de las que hay registradas como compradas: ' +
      negativos.map(function (p) { return esc(p.cod) + ' (' + p.stock + ')'; }).join(', ') +
      '. Cargá las compras que faltan en <b>Inventario → Registrar movimiento</b> y el número se corrige solo.</div>';
  }

  /* Por tipo de equipo — la lectura que pidió el negocio. */
  h += '<div class="panel"><div class="cab"><h2>Por tipo de equipo</h2></div><div class="cuerpo">';
  var porCat = {};
  ops.forEach(function (o) {
    var c = o.categoria || 'Sin categoría';
    porCat[c] = porCat[c] || { vend: 0, abierto: 0, ops: 0, unid: 0 };
    porCat[c].ops++;
    if (o.estado === 'Vendido') { porCat[c].vend += o.total; porCat[c].unid += o.cantidad; }
    else porCat[c].abierto += o.total;
  });
  var cats = Object.keys(porCat).sort(function (a, b) { return porCat[b].vend - porCat[a].vend; });
  var tope = Math.max.apply(null, cats.map(function (c) { return porCat[c].vend + porCat[c].abierto; }).concat([1]));
  if (!cats.length) h += '<div class="vacio">TODAVIA NO HAY OPORTUNIDADES CARGADAS</div>';
  h += '<div class="barras">';
  cats.forEach(function (c) {
    var d = porCat[c];
    h += '<div class="barra">' +
      '<div class="top"><span>' + esc(c) + ' <span class="tenue">· ' + d.ops + ' oportunidades · ' + d.unid + ' u. vendidas</span></span>' +
      '<span class="v">' + bs(d.vend) + (d.abierto ? ' <span class="warn">+' + bs(d.abierto) + '</span>' : '') + '</span></div>' +
      '<div class="riel">' +
        '<div class="relleno" style="width:' + (d.vend / tope * 100) + '%;display:inline-block"></div>' +
        '<div class="relleno abierto" style="width:' + (d.abierto / tope * 100) + '%;display:inline-block"></div>' +
      '</div></div>';
  });
  h += '</div></div></div>';

  /* Embudo por estado */
  h += '<div class="panel"><div class="cab"><h2>Embudo</h2></div><div class="cuerpo"><div class="kpis" style="margin:0">';
  D.catalogos.estados.forEach(function (e) {
    var f = ops.filter(function (o) { return o.estado === e; });
    var v = f.reduce(function (a, o) { return a + o.total; }, 0);
    h += kpi(e, String(f.length), bs(v), e === 'Vendido' ? 'acento' : '');
  });
  h += '</div></div></div>';

  /* Qué hacer hoy */
  if (vencidos.length) {
    h += '<div class="panel"><div class="cab"><h2>Para escribir hoy</h2>' +
      '<div class="der"><button class="mini" onclick="irA(\'pipeline\')">Ver pipeline</button></div></div>' +
      '<div class="tabla-wrap"><table><thead><tr>' +
      '<th>Cliente</th><th>Equipo</th><th>Estado</th><th class="num">Valor</th><th>Vencía</th><th></th>' +
      '</tr></thead><tbody>';
    vencidos.slice(0, 12).forEach(function (o) {
      h += '<tr><td>' + esc(o.cliente) + '<div class="mono tenue" style="font-size:11px">' + tel(o.telefono) + '</div></td>' +
        '<td>' + esc(o.producto) + ' <span class="mono tenue">' + esc(o.cod) + '</span></td>' +
        '<td>' + tagEstado(o.estado) + '</td>' +
        '<td class="num">' + bs(o.total) + '</td>' +
        '<td class="mono tenue">' + esc(o.proximo) + '</td>' +
        '<td class="acc"><button class="mini" onclick="mensaje(\'' + o.id + '\')">Mensaje</button> ' +
        '<button class="mini" onclick="agendar(\'' + o.id + '\')">Agendar</button></td></tr>';
    });
    h += '</tbody></table></div></div>';
  }

  return h;
}

function kpi(rotulo, cifra, nota, clase) {
  return '<div class="kpi ' + (clase || '') + '"><span class="etiqueta">' + esc(rotulo) + '</span>' +
    '<div class="cifra">' + esc(cifra) + '</div><div class="nota">' + esc(nota) + '</div></div>';
}
function irA(v) {
  VISTA = v;
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (x) {
    x.classList.toggle('on', x.dataset.v === v);
  });
  render();
}

function tagEstado(e) { return '<span class="tag ' + claseEstado(e) + '">' + esc(e) + '</span>'; }
function tagCanal(c) {
  var k = c === 'WhatsApp' ? 'wa' : c === 'Messenger' ? 'mes' : 'amb';
  var t = c === 'WhatsApp' ? 'WA' : c === 'Messenger' ? 'MSG' : 'WA+MSG';
  return '<span class="tag ' + k + '">' + t + '</span>';
}


/* ── Vista: Pipeline ────────────────────────────────────────────── */
function vPipeline() {
  var h = '';

  /* Chips por tipo de equipo: la separación que pidió el negocio. */
  var cats = D.catalogos.categorias.slice();
  D.oportunidades.forEach(function (o) {
    if (o.categoria && cats.indexOf(o.categoria) < 0) cats.push(o.categoria);
  });
  h += '<div class="filtros">';
  h += '<div class="campo busca"><span class="etiqueta">Buscar</span>' +
    '<input id="fq" placeholder="Cliente, teléfono, código…" value="' + esc(F.q) + '" oninput="F.q=this.value;pintarTabla()"></div>';
  h += '<div class="campo"><span class="etiqueta">Tipo de equipo</span><select id="fcat" onchange="F.cat=this.value;pintarTabla()">' +
    opt('', 'Todos', F.cat) + cats.map(function (c) { return opt(c, c, F.cat); }).join('') + '</select></div>';
  h += '<div class="campo"><span class="etiqueta">Estado</span><select onchange="F.estado=this.value;pintarTabla()">' +
    opt('', 'Todos', F.estado) + D.catalogos.estados.map(function (e) { return opt(e, e, F.estado); }).join('') + '</select></div>';
  h += '<div class="campo"><span class="etiqueta">Canal</span><select onchange="F.canal=this.value;pintarTabla()">' +
    opt('', 'Todos', F.canal) + D.catalogos.canales.map(function (c) { return opt(c, c, F.canal); }).join('') + '</select></div>';
  h += '<button class="primario" onclick="formOportunidad()">+ Nueva entrada</button>';
  h += '</div>';

  h += '<div id="tablaPipe"></div>';
  setTimeout(pintarTabla, 0);
  return h;
}

function opt(v, t, sel) {
  return '<option value="' + esc(v) + '"' + (String(sel) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
}

function filtradas() {
  var q = F.q.toLowerCase();
  return D.oportunidades.filter(function (o) {
    if (F.cat && o.categoria !== F.cat) return false;
    if (F.estado && o.estado !== F.estado) return false;
    if (F.canal && o.canal !== F.canal) return false;
    if (q && (o.cliente + ' ' + o.telefono + ' ' + o.cod + ' ' + o.producto + ' ' + o.ciudad)
      .toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function pintarTabla() {
  var cont = document.getElementById('tablaPipe');
  if (!cont) return;
  var ops = filtradas();

  if (!ops.length) {
    cont.innerHTML = '<div class="panel"><div class="vacio">NINGUNA OPORTUNIDAD CON ESOS FILTROS</div></div>';
    return;
  }

  /* Agrupado por tipo de equipo, con subtotales por grupo. */
  var grupos = {};
  ops.forEach(function (o) {
    var c = o.categoria || 'Sin categoría';
    (grupos[c] = grupos[c] || []).push(o);
  });

  var h = '';
  Object.keys(grupos).sort().forEach(function (cat) {
    var g = grupos[cat];
    var vend = g.filter(function (o) { return o.estado === 'Vendido'; });
    var subtotal = vend.reduce(function (a, o) { return a + o.total; }, 0);
    var abierto = g.filter(function (o) { return D.catalogos.estadosAbiertos.indexOf(o.estado) >= 0; })
      .reduce(function (a, o) { return a + o.total; }, 0);

    h += '<div class="panel"><div class="cab"><h2>' + esc(cat) + '</h2>' +
      '<span class="crumb">' + g.length + ' OPORTUNIDADES</span>' +
      '<div class="der"><span class="mono tenue" style="font-size:11px">' +
      'vendido ' + bs(subtotal) + ' · abierto ' + bs(abierto) + '</span></div></div>' +
      '<div class="tabla-wrap"><table><thead><tr>' +
      '<th>Cliente</th><th>Equipo</th><th class="num">Cant.</th><th class="num">Precio u.</th>' +
      '<th class="num">Total</th><th>Estado</th><th>Canal</th><th>Ciudad</th><th>Próximo</th><th></th>' +
      '</tr></thead><tbody>';

    g.forEach(function (o) {
      var vencido = o.proximo && o.proximo <= D.hoy && D.catalogos.estadosAbiertos.indexOf(o.estado) >= 0;
      h += '<tr>' +
        '<td>' + esc(o.cliente) + '<div class="mono tenue" style="font-size:11px">' + tel(o.telefono) + '</div></td>' +
        '<td>' + esc(o.producto) + '<div class="mono tenue" style="font-size:11px">' + esc(o.cod) + '</div></td>' +
        '<td class="num">' + o.cantidad + '</td>' +
        '<td class="num">' + bs(o.precio) + '</td>' +
        '<td class="num">' + bs(o.total) + '</td>' +
        '<td>' + tagEstado(o.estado) + '</td>' +
        '<td>' + tagCanal(o.canal) + '</td>' +
        '<td class="tenue">' + (esc(o.ciudad) || '—') + '</td>' +
        '<td class="mono ' + (vencido ? 'warn' : 'tenue') + '" style="font-size:11px">' + (esc(o.proximo) || '—') + '</td>' +
        '<td class="acc">' +
          '<button class="mini" onclick="mensaje(\'' + o.id + '\')" title="Armar mensaje">✉</button> ' +
          '<button class="mini" onclick="agendar(\'' + o.id + '\')" title="Agendar seguimiento">◷</button> ' +
          '<button class="mini" onclick="formOportunidad(\'' + o.id + '\')" title="Editar">✎</button>' +
        '</td></tr>';
    });
    h += '</tbody></table></div></div>';
  });

  cont.innerHTML = h;
}


/* ── Formulario de oportunidad (nueva entrada) ──────────────────── */
function formOportunidad(id) {
  var o = id ? D.oportunidades.filter(function (x) { return x.id === id; })[0] : null;
  var prods = D.productos.filter(function (p) { return p.activo; });

  var h = '<div class="campos">';
  h += '<div class="campo ancho"><span class="etiqueta">Cliente</span>' +
    '<input id="fCliente" value="' + esc(o ? o.cliente : '') + '" placeholder="Nombre del odontólogo o clínica"></div>';
  h += '<div class="campo"><span class="etiqueta">Teléfono</span>' +
    '<input id="fTel" value="' + esc(o ? o.telefono : '') + '" placeholder="71234567 o 59171234567"></div>';
  h += '<div class="campo"><span class="etiqueta">Ciudad</span>' +
    '<input id="fCiudad" value="' + esc(o ? o.ciudad : '') + '" placeholder="La Paz, Trópico…"></div>';

  h += '<div class="campo ancho"><span class="etiqueta">Equipo</span><select id="fCod" onchange="autoPrecio()">' +
    prods.map(function (p) {
      return '<option value="' + esc(p.cod) + '" data-precio="' + p.precio + '"' +
        (o && o.cod === p.cod ? ' selected' : '') + '>' + esc(p.cod + ' · ' + p.nombre) +
        ' (stock ' + p.stock + ')</option>';
    }).join('') + '</select></div>';

  h += '<div class="campo"><span class="etiqueta">Cantidad</span>' +
    '<input id="fCant" type="number" min="1" step="1" value="' + (o ? o.cantidad : 1) + '" oninput="calcTotal()"></div>';
  h += '<div class="campo"><span class="etiqueta">Precio unitario</span>' +
    '<input id="fPrecio" type="number" min="0" step="1" value="' + (o ? o.precio : '') + '" oninput="calcTotal()"></div>';
  h += '<div class="campo"><span class="etiqueta">Total</span>' +
    '<input id="fTotal" disabled value=""></div>';

  h += '<div class="campo"><span class="etiqueta">Estado</span><select id="fEstado">' +
    D.catalogos.estados.map(function (e) { return opt(e, e, o ? o.estado : 'Pregunta'); }).join('') + '</select></div>';
  h += '<div class="campo"><span class="etiqueta">Contacto por</span><select id="fCanal">' +
    D.catalogos.canales.map(function (c) { return opt(c, c, o ? o.canal : 'WhatsApp'); }).join('') + '</select></div>';
  h += '<div class="campo"><span class="etiqueta">Próximo contacto</span>' +
    '<input id="fProximo" type="date" value="' + esc(o ? o.proximo : '') + '"></div>';

  h += '<div class="campo ancho"><span class="etiqueta">Notas</span>' +
    '<textarea id="fNotas" placeholder="Qué pidió, qué quedó pendiente…">' + esc(o ? o.notas : '') + '</textarea></div>';
  h += '</div>';

  h += '<div class="aviso bien">Al marcar <b>Vendido</b> el CRM descuenta el stock solo, ' +
    'y guarda el número en Contactos si todavía no estaba.</div>';

  h += '<div class="acciones">' +
    '<button class="primario" id="fGuardar">' + (o ? 'Guardar cambios' : 'Crear entrada') + '</button>' +
    '<button onclick="cerrarModal()">Cancelar</button>';
  if (o) h += '<button class="peligro" style="margin-left:auto" onclick="borrarOportunidad(\'' + o.id + '\')">Eliminar</button>';
  h += '</div>';

  abrirModal(o ? 'Editar ' + o.id : 'Nueva entrada', h);
  if (!o) autoPrecio(); else calcTotal();

  document.getElementById('fGuardar').onclick = function () {
    var b = this;
    if (!val('fCliente')) return brindis('Falta el nombre del cliente.', true);
    b.disabled = true;
    srv('apiGuardarOportunidad', {
      id: o ? o.id : '', cliente: val('fCliente'), telefono: val('fTel'), ciudad: val('fCiudad'),
      cod: val('fCod'), cantidad: val('fCant'), precio: val('fPrecio'), estado: val('fEstado'),
      canal: val('fCanal'), proximo: val('fProximo'), notas: val('fNotas')
    }).then(function (r) {
      cerrarModal(); brindis('Guardado (' + r.id + ').');
      return cargar(true);
    }).catch(function (e) { b.disabled = false; brindis(e.message || e, true); });
  };
}

function autoPrecio() {
  var s = document.getElementById('fCod');
  var p = document.getElementById('fPrecio');
  if (s && p && !p.value) p.value = s.options[s.selectedIndex].dataset.precio || '';
  calcTotal();
}
function calcTotal() {
  var t = document.getElementById('fTotal');
  if (!t) return;
  t.value = bs((Number(val('fCant')) || 0) * (Number(val('fPrecio')) || 0));
}

function borrarOportunidad(id) {
  if (!confirm('¿Eliminar la oportunidad ' + id + '? La fila desaparece de la planilla.')) return;
  srv('apiEliminarOportunidad', id).then(function () {
    cerrarModal(); brindis('Eliminada.'); return cargar(true);
  }).catch(function (e) { brindis(e.message || e, true); });
}


/* ── Mensajes ───────────────────────────────────────────────────── */
function mensaje(idOp) {
  abrirModal('Mensaje', '<div class="vacio">ARMANDO EL MENSAJE…</div>');
  srv('apiMensaje', idOp, 'seguimiento', '').then(function (m) {
    var h = '<div class="campo"><span class="etiqueta">Plantilla</span><select id="mTipo" onchange="recargarPlantilla(\'' + idOp + '\')">' +
      opt('seguimiento', 'Seguimiento', 'seguimiento') + opt('cotizacion', 'Cotización', '') + opt('cierre', 'Cierre', '') +
      '</select></div>';
    h += '<div class="campo" style="margin-top:12px"><span class="etiqueta">Texto</span>' +
      '<textarea id="mTexto" style="min-height:110px">' + esc(m.texto) + '</textarea></div>';
    h += '<div class="acciones">';
    if (m.whatsapp) {
      h += '<a href="' + esc(m.whatsapp) + '" target="_blank" rel="noopener" id="mWa">' +
        '<button class="primario">Abrir WhatsApp</button></a>';
    } else {
      h += '<button disabled>Sin teléfono cargado</button>';
    }
    h += '<a href="' + esc(m.messenger) + '" target="_blank" rel="noopener"><button>Abrir Messenger</button></a>';
    if (m.waCloudActivo) h += '<button id="mEnviar">Enviar por WhatsApp API</button>';
    h += '<button onclick="cerrarModal()" style="margin-left:auto">Cerrar</button></div>';

    h += '<div class="aviso" style="margin-top:14px">El botón de WhatsApp abre el chat con el texto ya escrito. ' +
      '<b>Messenger no se puede abrir por número de teléfono</b> — Meta no lo permite — así que ese botón lleva a la bandeja de la página. ' +
      (m.waCloudActivo ? '' : 'Para enviar sin abrir el chat, cargá el token de WhatsApp Cloud API en Ajustes.') + '</div>';

    abrirModal('Mensaje para ' + esc(idOp), h);

    /* El link de WhatsApp se rearma cuando el texto cambia. */
    var ta = document.getElementById('mTexto');
    if (ta) ta.oninput = function () {
      var a = document.getElementById('mWa');
      if (a && m.telefono) a.href = 'https://wa.me/' + m.telefono + '?text=' + encodeURIComponent(ta.value);
    };
    var be = document.getElementById('mEnviar');
    if (be) be.onclick = function () {
      be.disabled = true;
      srv('apiEnviarWhatsApp', idOp, val('mTexto')).then(function (r) {
        be.disabled = false;
        if (r.enviado) { cerrarModal(); brindis('Mensaje enviado por WhatsApp API.'); cargar(true); }
        else brindis('No se envió: ' + r.motivo, true);
      }).catch(function (e) { be.disabled = false; brindis(e.message || e, true); });
    };
  }).catch(function (e) { brindis(e.message || e, true); cerrarModal(); });
}

function recargarPlantilla(idOp) {
  var tipo = val('mTipo');
  srv('apiMensaje', idOp, tipo, '').then(function (m) {
    document.getElementById('mTexto').value = m.texto;
    var a = document.getElementById('mWa');
    if (a && m.whatsapp) a.href = m.whatsapp;
  });
}


/* ── Agendar ────────────────────────────────────────────────────── */
function agendar(idOp) {
  var o = idOp ? D.oportunidades.filter(function (x) { return x.id === idOp; })[0] : null;
  var d = new Date(); d.setDate(d.getDate() + 2); d.setHours(9, 0, 0, 0);
  var iso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + 'T09:00';

  var h = '<div class="campos">';
  h += '<div class="campo ancho"><span class="etiqueta">Asunto</span><input id="aAsunto" value="' +
    esc(o ? 'Seguimiento ' + o.cod + ' — ' + o.cliente : '') + '" placeholder="Qué hay que hacer"></div>';
  h += '<div class="campo"><span class="etiqueta">Cuándo</span><input id="aCuando" type="datetime-local" value="' + iso + '"></div>';
  h += '<div class="campo"><span class="etiqueta">Canal</span><select id="aCanal">' +
    D.catalogos.canales.map(function (c) { return opt(c, c, o ? o.canal : 'WhatsApp'); }).join('') + '</select></div>';
  if (!o) {
    h += '<div class="campo"><span class="etiqueta">Cliente</span><input id="aCliente" placeholder="Nombre"></div>';
    h += '<div class="campo"><span class="etiqueta">Teléfono</span><input id="aTel" placeholder="71234567"></div>';
  }
  h += '<div class="campo ancho"><span class="etiqueta">Nota</span><textarea id="aNotas" placeholder="Detalle que quieras ver en la notificación"></textarea></div>';
  h += '</div>';
  h += '<div class="aviso bien">Se crea el evento en tu Google Calendar con avisos a 1 hora y 10 minutos, ' +
    'y con el link de WhatsApp dentro de la descripción para escribir desde la notificación.</div>';
  h += '<div class="acciones"><button class="primario" id="aGuardar">Agendar</button>' +
    '<button onclick="cerrarModal()">Cancelar</button></div>';

  abrirModal(o ? 'Agendar seguimiento · ' + esc(o.cliente) : 'Nuevo recordatorio', h);

  document.getElementById('aGuardar').onclick = function () {
    var b = this; b.disabled = true;
    srv('apiAgendar', {
      ref: o ? o.id : '', asunto: val('aAsunto'), cuando: val('aCuando'), canal: val('aCanal'),
      cliente: o ? o.cliente : val('aCliente'), telefono: o ? o.telefono : val('aTel'), notas: val('aNotas')
    }).then(function (r) {
      cerrarModal();
      brindis(r.calendario ? 'Agendado y anotado en Google Calendar.' : 'Agendado (Calendar no respondió).', !r.calendario);
      return cargar(true);
    }).catch(function (e) { b.disabled = false; brindis(e.message || e, true); });
  };
}


/* ── Vista: Inventario ──────────────────────────────────────────── */
function vInventario() {
  var h = '';
  var bajos = D.productos.filter(function (p) { return p.activo && p.stock <= p.stockMinimo; });
  var valor = D.productos.reduce(function (a, p) { return a + Math.max(p.stock, 0) * (p.costo || p.precio); }, 0);
  var unidades = D.productos.reduce(function (a, p) { return a + Math.max(p.stock, 0); }, 0);

  h += '<div class="kpis">' +
    kpi('Referencias', String(D.productos.length), D.productos.filter(function (p) { return p.activo; }).length + ' activas', '') +
    kpi('Unidades en stock', num(unidades), 'suma de todo el catálogo', '') +
    kpi('Valor del stock', bs(valor), 'a costo, o a precio si no hay costo', 'acento') +
    kpi('Bajo mínimo', String(bajos.length), bajos.length ? 'reponer' : 'todo cubierto', bajos.length ? 'aviso' : '') +
    '</div>';

  h += '<div class="panel"><div class="cab"><h2>Catálogo y stock</h2><div class="der">' +
    '<button class="mini" onclick="formMovimiento()">Registrar movimiento</button>' +
    '<button class="mini primario" onclick="formProducto()">+ Producto</button></div></div>' +
    '<div class="tabla-wrap"><table><thead><tr>' +
    '<th>COD</th><th>Equipo</th><th>Tipo</th><th class="num">Precio</th><th class="num">Costo</th>' +
    '<th class="num">Stock</th><th class="num">Mín.</th><th class="num">Vendidas</th><th></th>' +
    '</tr></thead><tbody>';

  var vendidasPorCod = {};
  D.oportunidades.filter(function (o) { return o.estado === 'Vendido'; })

      '<td class="num ' + clase + '"><b>' + p.stock + '</b></td>' +
      '<td class="num tenue">' + p.stockMinimo + '</td>' +

        '<button class="mini" onclick="formProducto(\'' + p.cod + '\')">✎</button>' +

  h += '</tbody></table></div></div>';

  h += '<div class="panel"><div class="cab"><h2>Últimos movimientos</h2>' +
    '<span class="crumb">' + D.movimientos.length + ' EN TOTAL</span></div><div class="tabla-wrap"><table><thead><tr>' +
    '<th>Fecha</th><th>COD</th><th>Tipo</th><th class="num">Cant.</th><th class="num">Costo u.</th><th>Motivo</th><th>Ref</th>' +
    '</tr></thead><tbody>';

    h += '<tr><td class="mono tenue">' + esc(m.fecha) + '</td><td class="mono">' + esc(m.cod) + '</td>' +
      '<td><span class="tag ' + (m.tipo === 'Salida' ? 'pregunta' : 'vendido') + '">' + esc(m.tipo) + '</span></td>' +

/* ── Vista: Métricas ────────────────────────────────────────────── */
function vMetricas() {
  var c = D.config;
  var h = '';

  h += '<div class="panel"><div class="cab"><h2>Ir a las métricas</h2></div><div class="cuerpo">';
  h += '<div class="campos">';
  h += enlaceMetrica('Facebook', c.facebook, 'La página del negocio y sus estadísticas', !!c.facebook);
  h += enlaceMetrica('Bandeja de Messenger', 'https://business.facebook.com/latest/inbox/all', 'Conversaciones de Messenger', true);
  h += enlaceMetrica('Meta Business Suite', 'https://business.facebook.com/latest/insights', 'Alcance, seguidores y publicaciones de la página', true);
  h += enlaceMetrica('WhatsApp Manager', 'https://business.facebook.com/wa/manage/home/', 'Plantillas, calidad del número y métricas de mensajes', true);
  h += enlaceMetrica('Catálogo de Meta', 'https://business.facebook.com/commerce/catalogs/', 'Productos, cobertura y errores del catálogo', true);
  h += enlaceMetrica('Instagram', c.instagram, 'Todavía no hay cuenta. Cuando la abras, cargá la URL en Ajustes y este botón se activa.', !!c.instagram);
  h += '</div>';
  h += '</div></div>';

  h += '<div class="panel"><div class="cab"><h2>Datos dentro del CRM</h2>' +
    '<div class="der"><button class="mini" onclick="traerMetricas()">Consultar Graph API</button></div></div>' +
    '<div class="cuerpo" id="metricasApi">' +
    '<div class="aviso">Para leer seguidores, alcance y estado del catálogo <b>acá adentro</b> hace falta una app de Meta ' +
    'con token de acceso. Cargalo en Ajustes (<span class="mono">wa_cloud_token</span>, <span class="mono">ig_business_id</span>, ' +
    '<span class="mono">meta_catalog_id</span>) y tocá «Consultar Graph API».<br><br>' +
    'Sin token el CRM funciona igual: los botones de arriba te llevan a los paneles de Meta.</div>' +
    '</div></div>';

  /* Lo que el CRM sí puede medir hoy, sin depender de Meta. */
  var porCanal = {};
  D.oportunidades.forEach(function (o) {
    var k = o.canal || 'Sin canal';
    porCanal[k] = porCanal[k] || { total: 0, vend: 0, ingreso: 0 };
    porCanal[k].total++;
    if (o.estado === 'Vendido') { porCanal[k].vend++; porCanal[k].ingreso += o.total; }
  });
  h += '<div class="panel"><div class="cab"><h2>Rendimiento por canal de contacto</h2>' +
    '<span class="crumb">DATO PROPIO, NO DE META</span></div><div class="tabla-wrap"><table><thead><tr>' +
    '<th>Canal</th><th class="num">Consultas</th><th class="num">Ventas</th><th class="num">Conversión</th><th class="num">Ingreso</th>' +
    '</tr></thead><tbody>';
  Object.keys(porCanal).forEach(function (k) {
    var d = porCanal[k];
    h += '<tr><td>' + tagCanal(k) + ' ' + esc(k) + '</td><td class="num">' + d.total + '</td>' +
      '<td class="num">' + d.vend + '</td>' +
      '<td class="num">' + (d.total ? Math.round(d.vend / d.total * 100) : 0) + '%</td>' +
      '<td class="num">' + bs(d.ingreso) + '</td></tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
}

function enlaceMetrica(nombre, url, desc, configurado) {
  var h = '<div class="kpi"><span class="etiqueta">' + esc(nombre) + '</span>' +
    '<div style="margin:8px 0 10px;font-size:12px;color:var(--ink2)">' + esc(desc) + '</div>';
  /* Un botón que lleva a la portada de la red no sirve de nada: si no hay
     URL cargada, el botón queda apagado y dice por qué. */
  h += configurado
    ? '<a href="' + esc(url) + '" target="_blank" rel="noopener"><button>Abrir</button></a>'
    : '<button disabled>Sin cuenta cargada</button>';
  return h + '</div>';
}

function traerMetricas() {
  var c = document.getElementById('metricasApi');
  c.innerHTML = '<div class="vacio">CONSULTANDO META…</div>';
  srv('apiMetricasMeta').then(function (r) {
    if (!r.disponible) { c.innerHTML = '<div class="aviso malo">' + esc(r.motivo) + '</div>'; return; }
    var h = '<div class="kpis" style="margin:0">';
    if (r.instagram && !r.instagram.error) {
      h += kpi('Seguidores IG', num(r.instagram.followers_count), '@' + (r.instagram.username || ''), 'acento');
      h += kpi('Publicaciones IG', num(r.instagram.media_count), r.instagram.name || '', '');
    }
    if (r.catalogo && !r.catalogo.error) {
      h += kpi('Productos en catálogo', num(r.catalogo.product_count), r.catalogo.name || '', 'acento');
    }
    h += '</div>';
    var errs = (r.errores || []).slice();
    if (r.instagram && r.instagram.error) errs.push('Instagram: ' + r.instagram.error.message);
    if (r.catalogo && r.catalogo.error) errs.push('Catálogo: ' + r.catalogo.error.message);
    if (errs.length) h += '<div class="aviso malo" style="margin-top:14px">' + errs.map(esc).join('<br>') + '</div>';
    if (h === '<div class="kpis" style="margin:0"></div>')
      h = '<div class="aviso">El token respondió pero no hay ids cargados. Completá <span class="mono">ig_business_id</span> y/o <span class="mono">meta_catalog_id</span> en Ajustes.</div>';
    c.innerHTML = h;
  }).catch(function (e) { c.innerHTML = '<div class="aviso malo">' + esc(e.message || e) + '</div>'; });
}

    '<b>SMILE CRM → Automatizaciones → Activar rutina diaria</b>. Manda un correo con los seguimientos vencidos, ' +
    'la agenda del día y las referencias bajo mínimo.</div>' +
    '<div class="aviso">Las claves de Meta (<span class="mono">wa_cloud_token</span>, <span class="mono">wa_cloud_phone_id</span>, ' +
    '<span class="mono">ig_business_id</span>, <span class="mono">meta_catalog_id</span>) se cargan directo en la pestaña ' +
    '<b>Config</b> de la planilla, no acá, para no dejar tokens dando vueltas en la interfaz.</div>' +
    '<div class="mono tenue" style="font-size:11px;margin-top:12px">WHATSAPP CLOUD API: ' +
    (c.waCloudActivo ? '<span class="ok">CONFIGURADO</span>' : 'NO CONFIGURADO — EL CRM USA LINKS wa.me') + '</div>';
  h += '</div></div>';
  return h;
}

function campoCfg(clave, rotulo, valor, ph) {
  return '<div class="campo"><span class="etiqueta">' + esc(rotulo) + '</span>' +
    '<input id="cfg_' + clave + '" value="' + esc(valor) + '" placeholder="' + esc(ph) + '"></div>';
}

function guardarAjustes() {
  var pares = {};
  Array.prototype.forEach.call(document.querySelectorAll('[id^="cfg_"]'), function (el) {
    pares[el.id.replace('cfg_', '')] = el.value.trim();
  });
  srv('apiGuardarConfig', pares).then(function () {
    brindis('Ajustes guardados.'); return cargar(true);
  }).catch(function (e) { brindis(e.message || e, true); });
}


/* ── Arranque ───────────────────────────────────────────────────── */
cargar();
</script>
